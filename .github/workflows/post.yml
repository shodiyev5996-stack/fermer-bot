name: Kanalga post joylash
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Postlarni yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: "@Jizzaxfermerlari"
        run: python bot.py
      - name: Yuborilganlar ro'yxatini saqlash
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "sent" && git push)
